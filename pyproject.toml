[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-workflow-observatory"
version = "0.1.0"
description = "Static HTML reports comparing expected vs actual compound-engineering skill workflow execution"
requires-python = ">=3.11"
dependencies = [
    "jinja2==3.1.6",
    "anthropic>=0.40.0",
    "rich==14.3.3",
]

[project.scripts]
swo = "swo.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
